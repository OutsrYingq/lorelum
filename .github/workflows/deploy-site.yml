name: Deploy site

# Auto-deploy only when the landing/docs site or its build inputs change.
# Path filtering is a GitHub-native feature; Workers Builds has no equivalent,
# which is why auto-deploy runs here instead of Cloudflare-side (see
# docs/site-deploy.md).
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "bun.lock" # dependency changes must reach the live site
      - "package.json" # root workspace scripts and deps feed the build
  workflow_dispatch: {} # manual redeploy without path filtering

# One deploy at a time; a superseded in-progress deploy is cancelled so the
# newest commit always wins.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: build · deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Scope deployment credentials to the production Environment.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Bun version pinned per ADR 0002 (packageManager field in package.json).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same pipeline as `bun run build:site` at the repo root.
      - name: Build site
        run: bun run --filter @lorelum/site build

      # Same command as `bun run deploy:site`; direct upload does not consume
      # Workers Builds minutes.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
